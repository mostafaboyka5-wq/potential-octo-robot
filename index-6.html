<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5FA8">
<title>NCA</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F2F5;--card:#fff;--tx:#111827;--mu:#6B7280;--ln:#E5E7EB;--pr:#1D5FA8;--link:#1D5FA8;--er:#C0392B}
@media(prefers-color-scheme:dark){:root{--bg:#0E1621;--card:#17212B;--tx:#E6EAF0;--mu:#8A97A8;--ln:#2B3A4A;--link:#5AA2E6;--er:#F28B82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--card)}
.bar{background:var(--pr);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:19px;font-weight:700}
.pad{padding:28px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.logo{width:64px;height:64px;border-radius:16px;background:var(--pr);color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
h1{margin:8px 0 0;font-size:26px;line-height:1.3}
label{font-size:14px;color:var(--mu);margin-top:4px}
input,select,textarea{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:10px 14px;font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.btn{min-height:48px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:700 16px Tajawal,system-ui,sans-serif;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.6}
.btn.sec{background:transparent;color:var(--link);border:1px solid var(--ln)}
.link{background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:8px}
.muted{color:var(--mu);font-size:14px}
.msg{min-height:24px;font-size:14px;color:var(--er)}
.msg.ok{color:var(--link)}
.main{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}
.av{width:48px;height:48px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:12px 0;font:inherit;font-size:13px;color:var(--mu);cursor:pointer}
.nav button[aria-current=true]{color:var(--link);font-weight:700}
.opt{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:15px;color:var(--tx);margin:0}
.opt input{width:20px;min-height:20px;accent-color:var(--pr)}
.sect{padding:16px 16px 4px;font-size:13px;font-weight:700;color:var(--mu)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://tablbghowhitmoimykkz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NJi8RWWSyoRWmm1RjwqcXQ_qQGxAJE1';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const INST = {
  cs: 'المعهد العالي لعلوم الحاسب ونظم المعلومات',
  mgmt: 'المعهد العالي للعلوم الإدارية والتجارة الخارجية',
  eng: 'المعهد العالي للهندسة والتكنولوجيا',
  arts: 'المعهد العالي للفنون التطبيقية'
};
const DM = {
  all: 'جميع المستخدمين',
  institute: 'أعضاء معهدي فقط',
  approval: 'بعد موافقتي على الطلب',
  none: 'لا أحد'
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = (html) => { $('#app').innerHTML = html; };
const say = (t, ok) => { const m = $('#msg'); if (m) { m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); } };
const busy = (b, on) => { b.disabled = on; };

let me = null, tab = 'profile', mode = 'login';

function authError(e) {
  const m = (e && e.message) || '';
  if (/Invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة';
  if (/already registered/i.test(m)) return 'هذا البريد مسجل بالفعل، سجّل الدخول';
  if (/not confirmed/i.test(m)) return 'لم يتم تفعيل البريد بعد، افتح رسالة التفعيل';
  if (/at least 6/i.test(m)) return 'كلمة المرور يجب ألا تقل عن 6 أحرف';
  if (/valid email|invalid.*email/i.test(m)) return 'صيغة البريد غير صحيحة';
  if (/rate limit/i.test(m)) return 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة';
  if (/fetch|network/i.test(m)) return 'تعذر الاتصال بالإنترنت';
  return 'حدث خطأ: ' + m;
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return viewAuth();
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error) { show('<div class="pad"><div class="msg" role="alert">تعذر تحميل الحساب: ' + esc(error.message) + '</div><button class="btn" id="re">إعادة المحاولة</button></div>'); $('#re').onclick = boot; return; }
  if (!data) return viewComplete(session.user);
  me = data;
  viewMain();
}

function viewAuth() {
  const signup = mode === 'signup';
  show(`<div class="pad">
    <div class="logo">NCA</div>
    <h1>${signup ? 'إنشاء حساب' : 'تسجيل الدخول'}</h1>
    <div class="muted">مجتمع طلاب أكاديمية القاهرة الجديدة</div>
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" dir="ltr" autocomplete="email" inputmode="email">
    <label for="pw">كلمة المرور</label>
    <input id="pw" type="password" dir="ltr" autocomplete="${signup ? 'new-password' : 'current-password'}">
    <div id="msg" class="msg" role="alert"></div>
    <button class="btn" id="go">${signup ? 'إنشاء الحساب' : 'دخول'}</button>
    <button class="link" id="sw">${signup ? 'لدي حساب بالفعل' : 'ليس لدي حساب'}</button>
  </div>`);
  $('#sw').onclick = () => { mode = signup ? 'login' : 'signup'; viewAuth(); };
  $('#go').onclick = async (ev) => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    if (!email || !password) return say('أدخل البريد وكلمة المرور');
    busy(ev.target, true); say('');
    const { data, error } = signup
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    busy(ev.target, false);
    if (error) return say(authError(error));
    if (signup && !data.session) return say('تم إنشاء الحساب. افتح بريدك لتفعيله ثم سجّل الدخول.', true);
    boot();
  };
}

function viewComplete(user) {
  show(`<div class="pad">
    <h1>أكمل ملفك الشخصي</h1>
    <div class="muted">يظهر للآخرين: اسم المستخدم والاسم والنبذة فقط. بريدك لا يظهر لأحد.</div>
    <label for="un">اسم المستخدم (إنجليزي)</label>
    <input id="un" dir="ltr" autocapitalize="none" autocomplete="off" placeholder="sara_nca">
    <label for="fn">الاسم</label>
    <input id="fn" maxlength="60">
    <label for="in">المعهد</label>
    <select id="in"><option value="">اختر معهدك</option>${Object.entries(INST).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
    <label for="bio">نبذة عنك (اختياري)</label>
    <textarea id="bio" maxlength="160"></textarea>
    <div id="msg" class="msg" role="alert"></div>
    <button class="btn" id="go">حفظ ومتابعة</button>
    <button class="link" id="out">تسجيل الخروج</button>
  </div>`);
  $('#out').onclick = async () => { await sb.auth.signOut(); boot(); };
  $('#go').onclick = async (ev) => {
    const username = $('#un').value.trim().toLowerCase(), full_name = $('#fn').value.trim(), institute = $('#in').value, bio = $('#bio').value.trim();
    if (!/^[a-z0-9_.]{3,20}$/.test(username)) return say('اسم المستخدم: من 3 إلى 20 حرفاً إنجليزياً صغيراً أو أرقاماً أو _ .');
    if (!full_name) return say('أدخل اسمك');
    if (!institute) return say('اختر معهدك');
    busy(ev.target, true); say('');
    const { error } = await sb.from('profiles').insert({ id: user.id, username, full_name, institute, bio });
    busy(ev.target, false);
    if (error) return say(error.code === '23505' ? 'اسم المستخدم مستخدم، اختر اسماً آخر' : 'تعذر الحفظ: ' + error.message);
    boot();
  };
}

function viewMain() {
  const titles = { chats: 'المحادثات', posts: 'المنشورات', profile: 'حسابي' };
  show(`<div class="bar">${titles[tab]}</div><div class="main" id="body"></div>
    <nav class="nav" aria-label="التنقل">
      ${['posts', 'chats', 'profile'].map((t) => `<button data-t="${t}" aria-current="${tab === t}">${titles[t]}</button>`).join('')}
    </nav>`);
  document.querySelectorAll('.nav button').forEach((b) => b.onclick = () => { tab = b.dataset.t; viewMain(); });
  if (tab === 'chats') return tabChats();
  if (tab === 'posts') return ($('#body').innerHTML = '<div class="pad muted">صفحة المنشورات تُضاف في المهمة 6.</div>');
  tabProfile();
}

async function tabChats() {
  const body = $('#body');
  body.innerHTML = '<div class="pad muted">جارٍ التحميل...</div>';
  const { data, error } = await sb.from('members').select('role, groups(id,name,kind)').eq('user_id', me.id);
  if (error) { body.innerHTML = '<div class="pad"><div class="msg">' + esc(error.message) + '</div></div>'; return; }
  const gs = (data || []).filter((m) => m.groups);
  body.innerHTML = '<div class="sect">مجموعاتي</div>' + (gs.length ? gs.map((m) => `
    <div class="row"><div class="av">${esc(m.groups.name.replace('المعهد العالي ', '').charAt(0))}</div>
    <div><b>${esc(m.groups.name)}</b><div class="muted">${m.groups.kind === 'institute' ? 'مجموعة معهدك · مفتوحة دائماً' : 'مجموعة'}</div></div></div>`).join('') : '<div class="pad muted">لم تنضم لأي مجموعة بعد.</div>')
    + '<div class="pad muted">المحادثة النصية تُفعّل في المهمة 5.</div>';
}

function tabProfile() {
  const initial = esc((me.full_name || '?').charAt(0));
  $('#body').innerHTML = `
    <div class="row" style="padding:20px 16px"><div class="av" style="width:68px;height:68px;font-size:28px">${initial}</div>
      <div><b style="font-size:18px">${esc(me.full_name)}</b><div class="muted" dir="ltr" style="text-align:right">@${esc(me.username)}</div>
      <div class="muted">${esc(INST[me.institute] || '')}</div></div></div>
    <div class="pad" style="padding-top:8px">
      <div class="muted">بريدك ورقمك مخفيان عن جميع المستخدمين.</div>
      <label for="fn">الاسم</label>
      <input id="fn" maxlength="60" value="${esc(me.full_name)}">
      <label for="bio">النبذة</label>
      <textarea id="bio" maxlength="160">${esc(me.bio)}</textarea>
      <div class="sect" style="padding:12px 0 0">من يستطيع مراسلتك؟</div>
      ${Object.entries(DM).map(([k, v]) => `<label class="opt"><input type="radio" name="dm" value="${k}" ${me.dm_policy === k ? 'checked' : ''}>${esc(v)}</label>`).join('')}
      <div id="msg" class="msg" role="alert"></div>
      <button class="btn" id="save">حفظ التغييرات</button>
      <button class="btn sec" id="out">تسجيل الخروج</button>
    </div>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); me = null; tab = 'profile'; boot(); };
  $('#save').onclick = async (ev) => {
    const full_name = $('#fn').value.trim(), bio = $('#bio').value.trim();
    const dm_policy = (document.querySelector('input[name=dm]:checked') || {}).value;
    if (!full_name) return say('الاسم مطلوب');
    busy(ev.target, true); say('');
    const { data, error } = await sb.from('profiles').update({ full_name, bio, dm_policy }).eq('id', me.id).select().single();
    busy(ev.target, false);
    if (error) return say('تعذر الحفظ: ' + error.message);
    me = data; say('تم حفظ التغييرات', true);
  };
}

boot();
</script>
</body>
</html>
